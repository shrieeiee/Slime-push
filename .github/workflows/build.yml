name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux / Steam Deck
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxfixes-dev libwayland-dev libxkbcommon-dev wayland-protocols libasound2-dev \
            libpulse-dev libudev-dev libdbus-1-dev libegl-dev libgl-dev libdrm-dev libgbm-dev libdecor-0-dev
          pip install --break-system-packages ziglang==0.13.0
      - name: Build
        run: ./tools/build-linux.sh
      - name: Self-test
        run: ./build-linux/SlimePush --selftest 5
      - uses: actions/upload-artifact@v4
        with:
          name: SlimePush-linux-steamdeck
          path: dist/SlimePush-linux-steamdeck.tar.gz

  windows:
    name: Windows
    # Built with Microsoft's own compiler on Windows: MSVC builds trip Defender's
    # machine-learning heuristics far less often than MinGW cross-compiles.
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      SDL_VER: 2.30.9
    steps:
      - uses: actions/checkout@v4
      - name: Get SDL2 (official Visual C++ package)
        shell: pwsh
        run: |
          $u = "https://github.com/libsdl-org/SDL/releases/download/release-$env:SDL_VER/SDL2-devel-$env:SDL_VER-VC.zip"
          Invoke-WebRequest $u -OutFile sdl.zip
          Expand-Archive sdl.zip -DestinationPath deps
      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build-windows -G "Visual Studio 17 2022" -A x64 -DSDL2_DIR="$PWD/deps/SDL2-$env:SDL_VER/cmake"
          cmake --build build-windows --config Release --parallel
      - name: Self-test
        shell: pwsh
        run: |
          Copy-Item "deps/SDL2-$env:SDL_VER/lib/x64/SDL2.dll" build-windows/Release/
          $p = Start-Process build-windows/Release/SlimePush.exe -ArgumentList "--selftest","3" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/SlimePush -Force | Out-Null
          Copy-Item build-windows/Release/SlimePush.exe, build-windows/Release/SDL2.dll, README.md dist/SlimePush/
          Copy-Item "deps/SDL2-$env:SDL_VER/README-SDL.txt" dist/SlimePush/ -ErrorAction SilentlyContinue
          Compress-Archive dist/SlimePush dist/SlimePush-windows.zip -Force
          Get-FileHash dist/SlimePush/SlimePush.exe -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: SlimePush-windows
          path: dist/SlimePush-windows.zip

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Slime Push $GITHUB_REF_NAME" --notes "Steam Deck / Linux and Windows builds. They play each other over LAN."
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
